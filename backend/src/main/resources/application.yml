spring:
  application:
    name: material-studio-api
  profiles:
    default: demo
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13360/material_platform?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:material_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: MP_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'

app:
  origin: ${APP_ORIGIN:http://localhost:3001}
  storage-root: ${STORAGE_ROOT:./.local/material-files}
sim:
  validate-delay-ms: ${SIM_VALIDATE_DELAY_MS:1000}
  generate-delay-ms: ${SIM_GENERATE_DELAY_MS:5000}
  finalize-delay-ms: ${SIM_FINALIZE_DELAY_MS:1000}
  fail-at-step: ${SIM_FAIL_AT_STEP:NONE}
demo:
  simulation-override-enabled: ${DEMO_SIMULATION_OVERRIDE_ENABLED:false}
  control-key: ${DEMO_CONTROL_KEY:}
task:
  executor-threads: ${TASK_EXECUTOR_THREADS:2}
  executor-queue-capacity: ${TASK_EXECUTOR_QUEUE_CAPACITY:20}

openapi: 3.0.3
info:
  title: 素材制作平台模拟生成 API
  version: 1.0.0
  description: 完整 V1 设计契约。v0.1 初始化已实现 health 与模板四项 GET 操作；身份、上传、制作任务仍待实现。Java 为唯一业务入口。
servers:
- url: /
  description: 同源入口；本地为 http://localhost:3000
tags:
- name: 身份
- name: 模板
- name: 素材
- name: 任务
- name: 运行状态
security:
- CookieAuth: []
paths:
  /api/auth/csrf:
    get:
      operationId: getCsrf
      summary: 获取当前会话 CSRF token
      tags:
      - 身份
      security: []
      description: 允许未登录；必要时创建匿名会话。响应 no-store，登录/退出后重新获取。
      responses:
        '200':
          description: CSRF token
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Set-Cookie:
              description: MP_SESSION；HttpOnly、SameSite=Lax、Path=/，HTTPS 时 Secure。登录更换会话 ID。
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/auth/login:
    post:
      operationId: demoLogin
      summary: 选择固定演示身份
      tags:
      - 身份
      security: []
      description: 仅用于演示，无密码/真实身份保证；建立会话并轮换会话 ID、CSRF token。
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLogin'
      responses:
        '200':
          description: 演示身份；之后重新 GET csrf
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Set-Cookie:
              description: MP_SESSION；HttpOnly、SameSite=Lax、Path=/，HTTPS 时 Secure。登录更换会话 ID。
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/auth/me:
    get:
      operationId: getMe
      summary: 查询当前身份
      tags:
      - 身份
      responses:
        '200':
          description: 当前演示身份
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/auth/logout:
    post:
      operationId: logout
      summary: 退出当前会话
      tags:
      - 身份
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: 已退出，无响应 body
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Set-Cookie:
              description: MP_SESSION；HttpOnly、SameSite=Lax、Path=/，HTTPS 时 Secure。登录更换会话 ID。
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/templates:
    get:
      operationId: listTemplates
      summary: 查询模板和全部分类
      tags:
      - 模板
      security: []
      parameters:
      - name: category
        in: query
        description: 省略或空字符串表示全部；未知分类返回空 items
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: categories 为所有启用分类，items 为过滤结果
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
      x-implementation-status: initialized
  /api/templates/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TemplateId'
    get:
      operationId: getTemplate
      summary: 查询模板详情
      tags:
      - 模板
      security: []
      responses:
        '200':
          description: 启用模板及素材约束
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implementation-status: initialized
  /api/templates/{id}/cover:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TemplateId'
    get:
      operationId: getTemplateCover
      summary: 读取公开演示封面
      tags:
      - 模板
      security: []
      responses:
        '200':
          description: 公开模板封面；class path 文件缺失为 503
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-implementation-status: initialized
  /api/assets:
    post:
      operationId: uploadAsset
      summary: 上传单张合法 JPEG/PNG
      tags:
      - 素材
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/Origin'
      description: 单文件最多 5 MiB、请求最多 6 MiB；宽高≤8192、像素总数≤25000000。签名、声明 MIME 和解码结果须一致。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 已持久化且属于当前用户的素材
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/TooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedType'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/assets/{id}/content:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getAssetContent
      summary: 鉴权读取素材图片
      tags:
      - 素材
      description: 不存在/他人对象统一 404。只读，禁止静态公开目录绕过权限。
      responses:
        '200':
          description: 图片内容；受保护资源为 private, no-store。
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/tasks:
    post:
      operationId: createTask
      summary: 幂等建档后异步提交制作任务
      tags:
      - 任务
      parameters:
      - $ref: '#/components/parameters/CsrfToken'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/DemoControlKey'
      description: 202 不等待三阶段结束；同用户同键同内容回放原 ID，不重复投递。执行器拒绝也保留 FAILED 任务并返回 202。提交不确定用原键重试。simulation 出现时开发密钥与覆盖开关均必需。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTask'
      responses:
        '202':
          description: 受理或幂等回放；status 可能已是 RUNNING/终态
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Location:
              description: /api/tasks/{taskId}
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedTask'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
    get:
      operationId: listTasks
      summary: 查询当前用户个人历史/进行中任务
      tags:
      - 任务
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ALL
          - ACTIVE
          - SUCCEEDED
          - FAILED
          default: ALL
      - name: templateId
        in: query
        schema:
          $ref: '#/components/schemas/TemplateId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 1024
        description: 上一页 nextCursor；更换筛选时重置
      description: 按 createdAt DESC, taskId DESC 排序。ACTIVE 包含 QUEUED/RUNNING，前端应读取全部 ACTIVE 页恢复较早进行中任务。
      responses:
        '200':
          description: 仅含当前会话所属用户的任务
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
  /api/tasks/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getTask
      summary: 只读查询任务与阶段一致快照
      tags:
      - 任务
      description: 不存在/他人任务统一 404。steps 顺序固定；查询不修改 version/updatedAt/业务状态。
      responses:
        '200':
          description: 任务、3 阶段与输入关联；业务失败仍为 HTTP 200
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/tasks/{id}/result:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getTaskResult
      summary: 鉴权预览成功任务结果
      tags:
      - 任务
      description: 非成功 409；结果文件丢失 503，不修改已成功历史。
      responses:
        '200':
          description: 图片内容；受保护资源为 private, no-store。
          headers:
            X-Request-ID:
              description: 请求关联标识
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/InternalError'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/health:
    get:
      operationId: getHealth
      summary: 检查 Java API 连通性
      tags:
      - 运行状态
      security: []
      x-implementation-status: initialized
      responses:
        '200':
          description: 仅代表 Java 连通；数据库就绪见内部 Actuator readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: MP_SESSION
      description: HttpOnly 演示会话 Cookie，不接受客户端 userId 作为授权依据。
  parameters:
    CsrfToken:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: GET /api/auth/csrf 获取；登录/退出后失效须重新获取。
      schema:
        type: string
        minLength: 1
    Origin:
      name: Origin
      in: header
      required: false
      description: 浏览器自动携带；变更请求若存在必须等于 APP_ORIGIN。CSRF 校验始终必需。
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 用户维度 UUID；网络重试保留原键与原逻辑内容，修改内容使用新键。
      schema:
        type: string
        format: uuid
    DemoControlKey:
      name: X-Demo-Control-Key
      in: header
      required: false
      description: 仅 simulation 出现时且开启开发覆盖时必需；普通前端不持有。
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: 参数/文件/约束/模拟覆盖不合法；code 见技术文档。
      headers:
        X-Request-ID:
          description: 请求关联标识
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: 会话不存在或失效。
      headers:
        X-Request-ID:
          description: 请求关联标识
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: CSRF_INVALID 或 DEMO_CONTROL_FORBIDDEN；不等于任务执行失败。
      headers:
        X-Request-ID:
          description: 请求关联标识
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 对象不存在/已下架，或不属于当前用户；不泄漏他人资源是否存在。
      headers:
        X-Request-ID:
          description: 请求关联标识
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: IDEMPOTENCY_CONFLICT 或 RESULT_NOT_READY。
      headers:
        X-Request-ID:
          description: 请求关联标识
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: FILE_TOO_LARGE；单文件或请求体超过上限。
      headers:
        X-Request-ID:
          description: 请求关联标识
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedType:
      description: UNSUPPORTED_IMAGE_TYPE；不支持类型或 MIME 不匹配。
      headers:
        X-Request-ID:
          description: 请求关联标识
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 存储/数据库暂不可用。SUBMISSION_UNCERTAIN 的 details 可含 taskId。
      headers:
        X-Request-ID:
          description: 请求关联标识
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 未预期服务错误；不返回堆栈、凭据或服务器绝对路径。
      headers:
        X-Request-ID:
          description: 请求关联标识
          schema:
            type: string
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    TemplateId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z0-9][a-z0-9-]*$
    TaskStatus:
      type: string
      enum:
      - QUEUED
      - RUNNING
      - SUCCEEDED
      - FAILED
    StepName:
      type: string
      enum:
      - VALIDATE
      - GENERATE
      - FINALIZE
    StepStatus:
      type: string
      enum:
      - PENDING
      - RUNNING
      - SUCCEEDED
      - FAILED
      - SKIPPED
    Error:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - details
      - requestId
      properties:
        code:
          type: string
          maxLength: 64
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          maxLength: 512
        details:
          type: object
          nullable: true
          additionalProperties: true
        requestId:
          type: string
    Csrf:
      type: object
      additionalProperties: false
      required:
      - token
      - headerName
      properties:
        token:
          type: string
          minLength: 1
        headerName:
          type: string
          enum:
          - X-CSRF-TOKEN
    DemoLogin:
      type: object
      additionalProperties: false
      required:
      - demoUserId
      properties:
        demoUserId:
          type: string
          enum:
          - demo-a
          - demo-b
    User:
      type: object
      additionalProperties: false
      required:
      - userId
      - displayName
      - mode
      properties:
        userId:
          type: string
          enum:
          - demo-a
          - demo-b
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        mode:
          type: string
          enum:
          - DEMO
    Template:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - category
      - coverUrl
      - description
      - requiredImageCount
      - acceptedMimeTypes
      - maxFileSizeBytes
      properties:
        id:
          $ref: '#/components/schemas/TemplateId'
        title:
          type: string
          maxLength: 128
        category:
          type: string
          maxLength: 64
        coverUrl:
          type: string
